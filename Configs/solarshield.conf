# =================================================================
# SOLAR SHIELD R-TADS: MOSQUITTO BROKER CONFIGURATION
# =================================================================

# 1. Network Binding
# Runnable laptop-only plaintext lab default.
# For ESP32 access, replace 127.0.0.1 with an IP currently assigned to
# the laptop on the isolated lab network. A stale IP prevents startup.
# The end-to-end test uses a separate TLS listener and temporary credentials.
listener 1883 127.0.0.1

# 2. Authentication
# Disable anonymous access and point to our hashed password file.
allow_anonymous false
password_file /etc/mosquitto/passwd

# 3. Granular Logging for SOC Visibility
# Direct logs to a dedicated file instead of just journald.
#log_dest file /var/log/mosquitto/mosquitto.log

# Specify exactly what to log. This captures connections, disconnections,
# errors, and warnings—perfect for SIEM ingestion.
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

